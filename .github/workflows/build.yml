name: build

on: [push, pull_request, workflow_dispatch]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Make bootstrap executable
        run: chmod +x tools/bootstrap.sh

      - name: Generate Flutter project
        run: bash tools/bootstrap.sh

      - name: Analyze Flutter project
        working-directory: build_app
        run: flutter analyze

      - name: Build Android APK
        working-directory: build_app
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: cutline-debug-apk
          path: build_app/build/app/outputs/flutter-apk/app-debug.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Flutter project
        run: bash tools/bootstrap.sh

      - name: Build iOS
        working-directory: build_app
        run: flutter build ios --debug --no-codesign
