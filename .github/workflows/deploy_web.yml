name: "بناء ونشر واجهة محرر الفيديو سحابياً"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Web Application
        run: |
          # العثور على المجلد الحقيقي الذي يحتوي على كود فلاتر الأصلي لضمان البناء المستقر
          FLUTTER_ROOT=$(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "🚀 تم رصد المشروع في: $FLUTTER_ROOT"
          cd "$FLUTTER_ROOT"
          
          flutter config --enable-web
          flutter pub get
          flutter build web --base-href "/${{ github.event.repository.name }}/"
          
          # تجهيز مجلد مستقل ونظيف تماماً خارج مسار العمل لمنع التكرار
          mkdir -p ../clean_web_output
          cp -r build/web/* ../clean_web_output/

      - name: Upload Single Production Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: clean_web_output # رفع المجلد النظيف والمنفرد فقط

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
