name: "بناء ونشر واجهة محرر الفيديو سحابياً"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Force Project Root and Build
        run: |
          # التحقق من وجود ملف pubspec وإذا لم يوجد يتم إنشاؤه لإنقاذ البناء
          if [ ! -f "pubspec.yaml" ]; then
            echo "⚠️ لم يتم العثور على pubspec.yaml، جاري توليد هيكل المشروع الأصيل..."
            cat << 'INNER_EOF' > pubspec.yaml
          name: clopcat_app
          description: "CapCut Premium Clone Mobile and Web Platform"
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.6
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
          flutter:
            uses-material-design: true
          INNER_EOF
          fi

          # إجبار جيت هاب على إنشاء مجلدات الويب الافتراضية إذا كانت مفقودة
          mkdir -p web
          if [ ! -f "web/index.html" ]; then
            flutter create . --platforms web --overwrite
          fi

          echo "📦 تهيئة منصة الويب وجلب الحزم..."
          flutter config --enable-web
          flutter pub get
          
          echo "🏗️ جاري بناء نسخة الويب للتطبيق..."
          flutter build web --base-href "/${{ github.event.repository.name }}/"
          
          # نقل المخرجات الجاهزة لمجلد الرفع المطلق
          mkdir -p "${{ github.workspace }}/final_web_build"
          cp -r build/web/* "${{ github.workspace }}/final_web_build/"

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: final_web_build

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
