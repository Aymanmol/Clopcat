name: "بناء ونشر واجهة محرر الفيديو سحابياً"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Detect and Build Flutter Project
        run: |
          # العثور على المسار الحقيقي لملف pubspec.yaml والتحرك إليه بدقة وثبات
          FLUTTER_PATH=$(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "🚀 تم رصد مشروع Flutter في المسار: $FLUTTER_PATH"
          
          # الدخول للمسار وتنفيذ أوامر التهيئة وجلب الحزم
          cd "$FLUTTER_PATH"
          flutter config --enable-web
          flutter pub get
          
          # بناء منصة الويب بالمعاملات الصحيحة للمستودع
          flutter build web --base-href "/${{ github.event.repository.name }}/"
          
          # إنشاء مجلد مخرجات ثابت ومطلق لضمان نجاح الرفع دون فقدان المسار
          mkdir -p "${{ github.workspace }}/final_web_build"
          cp -r build/web/* "${{ github.workspace }}/final_web_build/"

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: final_web_build

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
