name: "بناء ونشر واجهة محرر الفيديو سحابياً"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Force Absolute Cloud Build
        run: |
          echo "🏗️ تهيئة مشروع الويب في مسار مطلق..."
          
          # إنشاء مجلد البناء المستقل داخل مسار الجيت هاب الثابت
          cd ${{ github.workspace }}
          flutter create --platforms web --org com.aymanmol.clopcat target_web_project
          
          # نقل كافة ملفات البرمجة التي أنشأناها (التايملاين، الـ AI Studio، الـ Services) إلى المشروع الجديد
          if [ -d "lib" ]; then
            cp -r lib/* target_web_project/lib/ 2>/dev/null || true
          fi
          
          # الدخول للمشروع الجديد وبنائه
          cd target_web_project
          flutter config --enable-web
          flutter pub get
          flutter build web --base-href "/${{ github.event.repository.name }}/"
          
          # إنشاء مجلد المخرجات النهائي في المسار الرئيسي المطلق ونقل الملفات إليه
          mkdir -p ${{ github.workspace }}/clean_web_output
          cp -r build/web/* ${{ github.workspace }}/clean_web_output/
          
          echo "✅ اكتمل البناء السحابي ونقل الملفات بنجاح."

      - name: Upload Single Production Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ github.workspace }}/clean_web_output

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
